name: Verify

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          wf="${WF_REF%@*}"; wf="${wf##*/}"
          # Evidence is only a push run of this workflow from this repository, never this run: a pull request
          # tests its merge ref, a dispatch may run a subset, and a PR run of this workflow may itself be a skip.
          # Prints "<status> <conclusion>" of the newest such run on SHA $1, or nothing (any API error: nothing).
          newest_push() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$1&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\" and .id != $GITHUB_RUN_ID)] | max_by(.id) | select(. != null) | \"\(.status) \(.conclusion)\"" || true
          }
          green() { [ "$(newest_push "$1")" = "completed success" ]; }
          skip=false
          # C1: main push of a SHA whose newest push run of this workflow (a branch run) is green.
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && green "$GITHUB_SHA"; then skip=true; fi
          # C3 (exact): same tree as the parent, and the parent's newest push run is green (e.g. an empty commit).
          if [ "$skip" = false ] && [ "$EVENT" = push ] && parent=$(git rev-parse -q --verify HEAD~1) \
             && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD~1^{tree}')" ] && green "$parent"; then skip=true; fi
          # C2: same-repository PR. The lander takes any green same-repo run on the exact SHA as evidence,
          # pull_request runs included, so this run may pass without shards only when the push run on the
          # PR head is green: wait for it (at most 25 minutes).
          # No push run, any other result, or the wait running out: run in full.
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" = true ]; then
            for _ in $(seq 1 50); do
              state=$(newest_push "$PR_HEAD")
              case "$state" in
                'completed success') skip=true; break ;;
                ''|completed\ *) break ;;
                *) sleep 30 ;;
              esac
            done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  foundation:
    name: shards (foundation)
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VANE_VERIFY_SHARD: foundation
      VANE_VERIFY_BUILD_ARCHIVE: .cache/vane-build.tar
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Check edition source lock freshness
        if: ${{ hashFiles('edition.json', 'sources.lock.json') != '' }}
        run: node scripts/edition-authoring/cli.mjs check
      - name: Reclaim SDKs only if the build needs disk
        run: |
          for sdk in /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; do
            available=$(df -Pk . | awk 'NR == 2 {print $4}')
            if [ "$available" -ge 20971520 ]; then break; fi
            sudo rm -rf -- "$sdk"
          done
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer check --profile first-party
      - name: Build the app once for verification
        run: |
          pnpm run build
          mkdir -p .cache
          tar -cf "$VANE_VERIFY_BUILD_ARCHIVE" dist .wrangler/deploy/config.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vane-build
          path: .cache/vane-build.tar
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
      - name: Install Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          # Hosted ubuntu-24.04 already carries Chromium's libraries. Use apt only when a real launch fails.
          node scripts/ci/chromium-probe.mjs || {
            timeout 420 pnpm exec playwright install-deps chromium
            node scripts/ci/chromium-probe.mjs
          }
      - run: pnpm run verify
      - name: Set up the checkout's own owner and data
        run: |
          mkdir -p .cache
          (umask 077; printf '{"OWNER_EMAIL":"owner@example.test"}' > .cache/setup-answers.json)
          pnpm exec rer setup --answers .cache/setup-answers.json --non-interactive
      - name: DEMO-001 journey
        run: node --test tests/demo.journey.mjs

  shards:
    needs: [plan, foundation]
    if: needs.plan.outputs.skip != 'true'
    name: shards (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [product-1, product-2, product-3, integrations-1, integrations-2, integrations-3, integrations-4]
    env:
      VANE_VERIFY_SHARD: ${{ matrix.shard }}
      VANE_VERIFY_BUILD_ARCHIVE: .cache/vane-build.tar
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          # Hosted ubuntu-24.04 already carries Chromium's libraries. Use apt only when a real launch fails.
          node scripts/ci/chromium-probe.mjs || {
            timeout 420 pnpm exec playwright install-deps chromium
            node scripts/ci/chromium-probe.mjs
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: vane-build
          path: .cache
      - run: pnpm run verify

  # Keep the required check stable and require a successful plan before reusing a run.
  verify:
    needs: [plan, foundation, shards]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the plan and every shard
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test "$PLAN" = success
          if [ "$SKIP" = true ]; then exit 0; fi
          for result in $RESULTS; do test "$result" = success; done
