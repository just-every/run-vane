name: Import scale

# Full-scale parsing, interrupted publication and exact anonymous totals run
# separately from the ordinary verification shards, including on candidate branches.
on:
  push:
    paths:
      - 'tests/import-scale.journey.mjs'
      - 'scripts/history-import/**'
      - 'scripts/import-export.mjs'
      - 'src/vane/movein/**'
      - 'src/modules/import-kit/**'
      - 'tests/harness.mjs'
      - '.github/workflows/import-scale.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  umami-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build
      - run: node --test tests/import-scale.journey.mjs
