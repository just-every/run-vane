# Deployment is off unless the owner enables the RUN_SITE_DEPLOY variable.
name: Run site
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prove_unset_switch:
        description: 'Prove deployment skips with the effective switch unset'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: run-site
  cancel-in-progress: false
jobs:
  deployment-switch:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      run_site_deploy: ${{ steps.switch.outputs.run_site_deploy }}
    steps:
      - name: Resolve the effective deployment switch
        id: switch
        env:
          RUN_SITE_DEPLOY: ${{ vars.RUN_SITE_DEPLOY }}
          PROVE_UNSET_SWITCH: ${{ inputs.prove_unset_switch }}
        run: |
          if [ "$PROVE_UNSET_SWITCH" = true ]; then
            unset RUN_SITE_DEPLOY
            echo 'Run-site switch unset for this dispatch.'
          fi
          echo "run_site_deploy=${RUN_SITE_DEPLOY-}" >> "$GITHUB_OUTPUT"
  deploy:
    needs: deployment-switch
    if: needs.deployment-switch.outputs.run_site_deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: run-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer deploy --site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Public readback
        run: |
          domain=$(node -p "require('./deploy-site.json').domain")
          for _ in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "https://$domain/run")" = 200 ] && break
            sleep 10
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://$domain/run")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "https://www.$domain/")" = "301 https://$domain/"
