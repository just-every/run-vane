name: Proxy Next runtime acceptance

# Installer/runtime journey is deliberately separate from push Verify.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  downloaded-next-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec vite build
      - name: Prove downloaded setup through production Next and a real browser
        run: node --test tests/proxy-next.journey.mjs
