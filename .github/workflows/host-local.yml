name: Local installation journey
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  host-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      VANE_HOST_LOCAL_JOURNEY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: HOST-002 public local installation journey
        run: pnpm exec node --test --test-concurrency=1 tests/host-local.journey.mjs
